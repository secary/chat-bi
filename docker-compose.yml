name: chatbi

services:
  chatbi-db:
    image: m.daocloud.io/docker.io/library/mysql:8.0
    container_name: chatbi-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: chatbi_demo
      MYSQL_USER: demo_user
      MYSQL_PASSWORD: demo_pass
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysql -udemo_user -p$${MYSQL_PASSWORD} -D $${MYSQL_DATABASE} -e 'SELECT 1 FROM app_user LIMIT 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  chatbi-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Same-origin /api (see deploy/nginx.app.conf). Not taken from root .env to avoid
        # stale FRONTEND_API_BASE_URL=http://localhost:8226 breaking the prod bundle.
        VITE_API_BASE_URL: /api
    container_name: chatbi-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      CHATBI_DB_HOST: chatbi-db
      CHATBI_DB_PORT: 3306
      CHATBI_LOG_DB_HOST: chatbi-db
      CHATBI_LOG_DB_PORT: 3306
      CHATBI_MYSQL_CMD: mysql
    ports:
      - "5174:80"
    depends_on:
      chatbi-db:
        condition: service_healthy

volumes:
  mysql-data:
