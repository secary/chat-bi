[project]
name = "chat-bi"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "starlette==1.1.0",
    "uvicorn[standard]==0.48.0",
    "sse-starlette==2.4.1",
    "litellm==1.86.1",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "python-multipart==0.0.29",
    "pymysql==1.2.0",
    "cryptography==48.0.0",
    "passlib[bcrypt]==1.7.4",
    "PyJWT==2.12.1",
    "bcrypt==4.3.0",
    "pyyaml==6.0.3",
    "weasyprint==68.1",
    "pypdf==6.12.1",
    "reportlab==4.5.1",
    "matplotlib==3.10.9",
    "pillow==12.2.0",
    "pytest==9.0.3",
    "ruff==0.15.14",
    "black==26.5.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]
